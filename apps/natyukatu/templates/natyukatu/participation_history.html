{% extends "natyukatu/base.html" %}

{% block content %}
<section class="page-heading">
  <h1 class="page-title">参加履歴</h1>
</section>

<section class="history-card" aria-label="参加履歴一覧">
  {% if histories %}
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">開催日時</th>
          <th scope="col">募集名</th>
          <th scope="col">詳細</th>
        </tr>
      </thead>

      <tbody>
        {% for history in histories %}
        <tr>
          <td>
            {{ history.recruitment.start_at.strftime("%Y/%m/%d %H:%M") }}
          </td>
          <td>{{ history.recruitment.title }}</td>
          <td>
            <a
              class="detail-link"
              href="{{ url_for(
                'natyukatu.activity_detail',
                active_id=history.recruitment_id
              ) }}"
            >
              詳細を見る
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p>参加履歴はありません。</p>
  {% endif %}
</section>
{% endblock %}
