<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー管理 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--muted:#d5dce5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:94px;display:flex;align-items:center;padding:0 30px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}
    .brand{display:flex;align-items:center;gap:28px;text-decoration:none;color:inherit}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:28px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}
    .account{display:flex;align-items:center;gap:13px;padding:0 28px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}
    .logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:white;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 94px);display:grid;grid-template-columns:285px minmax(0,1fr)}
    .sidebar{padding:36px 12px;background:#ffffff80;border-right:1px solid var(--line)}.side-caption{padding:8px 18px 22px;color:#8092aa;font-weight:700}.nav{display:grid;gap:8px}.nav-link{height:61px;display:flex;align-items:center;gap:20px;padding:0 25px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:20px 18px}
    main{min-width:0;padding:30px 28px 42px}.page-title{margin:0 0 18px 4px;font-size:36px;line-height:1.25;font-weight:800}.profile-card{padding:18px 28px;border:1px solid #e0e8f1;border-radius:13px;background:#ffffffed;box-shadow:0 8px 26px #1d3f6708}.profile-row{min-height:61px;display:grid;grid-template-columns:280px minmax(0,1fr);align-items:center;padding:0 8px;border-bottom:1px solid #e1e9f2}.profile-row:last-child{border-bottom:0}.label{font-size:20px;font-weight:800}.skeleton{height:25px;border-radius:6px;background:linear-gradient(110deg,#dce2e9,#cfd7e0,#dce2e9)}.w-id{width:172px}.w-email{width:260px}.w-job{width:134px}.w-age,.w-gender{width:78px}.w-phone{width:168px}.password{font-size:22px;letter-spacing:4px;color:#78879b}.history-link{display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-size:19px;font-weight:800;text-decoration:none}.arrow{width:11px;height:11px;border-top:3px solid var(--blue);border-right:3px solid var(--blue);transform:rotate(45deg);margin-right:5px}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.summary-card{min-height:116px;display:flex;align-items:center;gap:28px;padding:20px 40px;border-radius:12px;background:linear-gradient(110deg,#e0f9f7,#e7faf8)}.summary-card.title{background:linear-gradient(110deg,#e9f3ff,#eaf3fc)}.summary-icon{width:44px;height:44px;fill:none;stroke:#00aaa8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex:none}.title .summary-icon{stroke:#087df0}.summary-label{margin-bottom:10px;font-size:18px;font-weight:800}.summary-value{width:204px;height:25px;border-radius:6px;background:linear-gradient(110deg,#dce2e9,#cfd7e0)}.title .summary-value{width:150px}
    .actions{display:flex;align-items:center;justify-content:center;gap:68px;margin-top:28px}.edit-button{min-width:348px;min-height:65px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(100deg,#087df0,#0875ed);color:white;font-size:21px;font-weight:800;text-decoration:none;box-shadow:0 5px 12px #0788f526}.withdraw{color:#df2525;font-size:19px;font-weight:800;text-decoration:underline;text-underline-offset:4px}
    @media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:28px 9px}.nav-link{padding:0 16px;font-size:16px;gap:14px}.profile-row{grid-template-columns:200px minmax(0,1fr)}}
    @media(max-width:650px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:20px 6px}.side-caption{padding:7px 5px 18px;font-size:11px;overflow:hidden}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:15px 5px}main{padding:22px 12px}.page-title{font-size:28px}.profile-card{padding:10px 13px}.profile-row{min-height:58px;grid-template-columns:minmax(105px,38%) minmax(0,1fr);padding:0 4px}.label{font-size:15px}.skeleton{height:20px;max-width:100%}.password{font-size:18px}.history-link{font-size:15px}.summary{grid-template-columns:1fr;gap:10px;margin-top:14px}.summary-card{min-height:86px;padding:14px 20px;gap:20px}.summary-icon{width:36px;height:36px}.summary-label{font-size:16px}.summary-value{height:21px}.actions{gap:22px;margin-top:22px;flex-direction:column}.edit-button{width:100%;min-width:0;min-height:56px;font-size:18px}.withdraw{font-size:16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#blue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#teal)"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="side-caption">称号</div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>

    <main>
      <h1 class="page-title">ユーザー管理</h1>
      <section class="profile-card" aria-label="ユーザー情報">
        <div class="profile-row"><span class="label">ユーザーID</span><span class="skeleton w-id" aria-label="ユーザーID"></span></div>
        <div class="profile-row"><span class="label">メールアドレス</span><span class="skeleton w-email" aria-label="メールアドレス"></span></div>
        <div class="profile-row"><span class="label">パスワード</span><span class="password" aria-label="パスワードは非表示">●●●●●●●●</span></div>
        <div class="profile-row"><span class="label">職業</span><span class="skeleton w-job" aria-label="職業"></span></div>
        <div class="profile-row"><span class="label">年齢</span><span class="skeleton w-age" aria-label="年齢"></span></div>
        <div class="profile-row"><span class="label">性別</span><span class="skeleton w-gender" aria-label="性別"></span></div>
        <div class="profile-row"><span class="label">電話番号</span><span class="skeleton w-phone" aria-label="電話番号"></span></div>
        <div class="profile-row"><a class="history-link" href="#participation-history"><span>参加履歴</span><i class="arrow" aria-hidden="true"></i></a></div>
      </section>

      <section class="summary" aria-label="ポイントと称号">
        <div class="summary-card"><svg class="summary-icon" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="11" rx="16" ry="7"/><path d="M8 11v11c0 4 7 7 16 7s16-3 16-7V11M8 22v11c0 4 7 7 16 7s16-3 16-7V22"/></svg><div><div class="summary-label">保有ポイント</div><div class="summary-value" aria-label="保有ポイント"></div></div></div>
        <div class="summary-card title"><svg class="summary-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M9 39h30l3-24-11 7-7-15-7 15-11-7Z"/><path d="M12 39v4h24v-4"/><circle cx="9" cy="12" r="3"/><circle cx="24" cy="5" r="3"/><circle cx="39" cy="12" r="3"/></svg><div><div class="summary-label">称号</div><div class="summary-value" aria-label="称号"></div></div></div>
      </section>

      <div class="actions"><a class="edit-button" href="user-information-change.html">ユーザー情報変更</a><a class="withdraw" href="withdrawal.html">退会</a></div>
    </main>
  </div>
</body>
</html>
