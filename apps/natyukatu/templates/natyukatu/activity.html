<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活動用画面 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--teal:#08aaa8;--muted:#c7d3e1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 26px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:25px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:27px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 26px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb;flex:none}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:300px minmax(0,1fr)}.sidebar{padding:32px 12px;background:#ffffff80;border-right:1px solid var(--line)}.user-badge{display:flex;align-items:center;gap:14px;padding:0 18px 22px;font-size:18px;font-weight:800}.user-badge .avatar{width:46px;height:46px}.nav{display:grid;gap:7px}.nav-link{height:61px;display:flex;align-items:center;gap:19px;padding:0 24px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:14px 18px}
    main{min-width:0;padding:28px 26px 32px}.page-title{margin:0 0 25px 3px;font-size:48px;line-height:1.2;font-weight:900}.activity-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.9fr);gap:14px;min-height:calc(100vh - 193px)}.panel{min-width:0;border:1.5px solid #dce9f9;border-radius:14px;background:#ffffffdd;box-shadow:0 4px 16px #1d3f6705;overflow:hidden}.message-panel{display:flex;flex-direction:column}.panel-header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 20px;border-bottom:1px solid #e6edf5}.panel-title{margin:0;font-size:27px;font-weight:900}.item-select{width:270px;max-width:55%;height:54px;padding:0 16px;border:1.5px solid #b9cbe0;border-radius:9px;background:#fff;color:#516b8c;font:inherit;font-size:17px;font-weight:700}.messages{flex:1;display:flex;flex-direction:column;gap:14px;padding:18px 24px;overflow:auto}.message-row{display:flex;align-items:flex-start;gap:14px}.message-avatar{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:#e4effb;flex:none}.message-avatar svg{width:46px;height:46px;fill:#9ab1cc}.bubble{position:relative;min-height:82px;flex:1;padding:17px 24px;border-radius:18px;background:linear-gradient(100deg,#edf6ff,#eaf5fd)}.bubble.alt{background:linear-gradient(100deg,#f1f4f7,#eef2f6)}.bubble:before{content:"";position:absolute;left:-9px;top:18px;border-top:10px solid transparent;border-bottom:10px solid transparent;border-right:12px solid #edf6ff}.bubble.alt:before{border-right-color:#f1f4f7}.line{display:block;height:15px;border-radius:5px;background:linear-gradient(90deg,#c8d5e5,#b7c8dd)}.line.long{width:82%}.line.medium{width:55%;margin-top:13px}.line.short{width:34%;margin-top:13px}.compose{display:flex;gap:14px;padding:5px 20px 20px}.compose-input{min-width:0;flex:1;height:70px;padding:0 18px;border:1.5px solid #b9cbe0;border-radius:9px;background:#fff;color:var(--navy);font:inherit;font-size:18px;outline:none}.compose-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0788f51a}.compose-input::placeholder{color:#8498b3}.send-button{width:136px;height:70px;border:0;border-radius:9px;background:linear-gradient(100deg,#0db9b1,#08aaa8);color:#fff;font:inherit;font-size:20px;font-weight:900;cursor:pointer}.send-button:hover{filter:brightness(1.05)}
    .participant-panel{display:flex;flex-direction:column}.participant-header{min-height:78px;display:flex;align-items:center;padding:14px 23px;border-bottom:1px solid #e6edf5}.participant-title{margin:0;font-size:27px;font-weight:900}.participant-list{padding:0 22px}.person{min-height:96px;display:flex;align-items:center;gap:22px;border-bottom:1px solid #e7edf4}.person:last-child{border-bottom:0}.person-avatar{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:#e4effb;flex:none}.person-avatar svg{width:46px;height:46px;fill:#9ab1cc}.person-lines{width:min(100%,150px)}.person-lines .line:first-child{width:100%}.person-lines .line:last-child{width:55%;margin-top:13px}.notice{min-height:24px;margin:0;padding:0 20px 12px;color:#078568;font-weight:700}
    @media(max-width:1000px){.layout{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding:26px 8px}.nav-link{padding:0 16px;font-size:16px;gap:13px}.activity-grid{grid-template-columns:minmax(0,1.45fr) minmax(240px,.85fr)}.page-title{font-size:42px}.panel-title,.participant-title{font-size:23px}.person{gap:13px}.participant-list{padding:0 15px}}
    @media(max-width:750px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:16px 6px}.user-badge{padding:0 5px 17px;justify-content:center}.user-badge .avatar{width:36px;height:36px}.user-badge span{display:none}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:13px 5px}main{padding:20px 12px}.page-title{font-size:34px;margin-bottom:18px}.activity-grid{grid-template-columns:1fr;min-height:0}.message-panel{min-height:580px}.participant-panel{min-height:360px}.panel-header,.participant-header{min-height:66px;padding:12px 15px}.panel-title,.participant-title{font-size:21px}.item-select{width:180px;height:45px;font-size:14px;padding:0 10px}.messages{padding:14px 12px;gap:12px}.message-avatar,.person-avatar{width:48px;height:48px}.message-avatar svg,.person-avatar svg{width:35px;height:35px}.bubble{min-height:72px;padding:14px}.line{height:12px}.line.medium,.line.short{margin-top:10px}.compose{gap:8px;padding:5px 12px 14px}.compose-input{height:54px;font-size:15px;padding:0 12px}.send-button{width:80px;height:54px;font-size:16px}.person{min-height:76px}.participant-list{padding:0 14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link active" href="activity.html"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.5a2.5 2.5 0 0 1-1-2Z"/></svg><span>活動用画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <h1 class="page-title">活動用画面</h1>
      <div class="activity-grid">
        <section class="panel message-panel" aria-labelledby="messagesTitle">
          <header class="panel-header"><h2 class="panel-title" id="messagesTitle">メッセージ</h2><select class="item-select" aria-label="表示項目"><option value="">項目を選択</option><option>メッセージ表示</option><option>参加者一覧表示</option></select></header>
          <div class="messages" id="messages" aria-live="polite">
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble alt"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line short"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble alt"><i class="line long"></i><i class="line medium"></i></div></div>
            <div class="message-row"><span class="message-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><div class="bubble"><i class="line long"></i><i class="line short"></i></div></div>
          </div>
          <form class="compose" id="messageForm"><input class="compose-input" id="messageInput" placeholder="メッセージを入力" aria-label="メッセージを入力"><button class="send-button" type="submit">送信</button></form>
          <p class="notice" id="notice" role="status"></p>
        </section>
        <aside class="panel participant-panel" aria-labelledby="participantsTitle">
          <header class="participant-header"><h2 class="participant-title" id="participantsTitle">参加者一覧</h2></header>
          <div class="participant-list">
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
            <div class="person"><span class="person-avatar" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg></span><span class="person-lines"><i class="line"></i><i class="line"></i></span></div>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <script>
    document.getElementById('messageForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const notice = document.getElementById('notice');
      if (!text) {
        notice.textContent = 'メッセージを入力してください。';
        input.focus();
        return;
      }
      const row = document.createElement('div');
      row.className = 'message-row';
      const avatar = document.createElement('span');
      avatar.className = 'message-avatar';
      avatar.setAttribute('aria-hidden','true');
      avatar.innerHTML = '<svg viewBox="0 0 48 48"><circle cx="24" cy="16" r="11"/><path d="M7 43c1-10 7-15 17-15s16 5 17 15Z"/></svg>';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      bubble.style.lineHeight = '1.5';
      row.append(avatar,bubble);
      document.getElementById('messages').appendChild(row);
      input.value = '';
      notice.textContent = 'メッセージを画面に追加しました（画面見本）';
      row.scrollIntoView({block:'nearest'});
    });
  </script>
</body>
</html>
