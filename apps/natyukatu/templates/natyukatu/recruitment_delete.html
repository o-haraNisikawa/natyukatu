{% extends "natyukatu/base.html" %}

{% block content %}
<section class="confirm-card" aria-labelledby="confirmTitle">
  <h1 class="confirm-title" id="confirmTitle">
    募集情報削除
  </h1>

  <p class="question">
        「{{ recruitment.title }}」を削除します。よろしいですか？
  </p>

  <p class="caution">
    削除すると元に戻せません。
  </p>

  <form
    class="actions"
    action="{{ url_for(
      'natyukatu.recruitment_delete',
      recruitment_id=recruitment.id
    ) }}"
    method="post"
  >
    <!-- CSRFトークン -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-row" style="margin: 1.5rem 0;">
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="checkbox" name="confirm_check" required>
        上記の内容を確認し、削除に同意します
      </label>
    </div>

    <button type="submit" class="button delete">削除する</button>

    <a
      class="button"
      href="{{ url_for('natyukatu.recruitment_history') }}"
    >
      キャンセル
    </a>
  </form>
</section>
{% endblock %}
