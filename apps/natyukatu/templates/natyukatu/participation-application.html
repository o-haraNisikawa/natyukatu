<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参加申し込み | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--teal:#08aaa8;--red:#fa5555}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 26px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:25px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:27px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 26px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:300px minmax(0,1fr)}.sidebar{padding:32px 12px;background:#ffffff80;border-right:1px solid var(--line)}.user-badge{display:flex;align-items:center;gap:14px;padding:0 18px 22px;font-size:18px;font-weight:800}.user-badge .avatar{width:46px;height:46px}.nav{display:grid;gap:7px}.nav-link{height:61px;display:flex;align-items:center;gap:19px;padding:0 24px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:14px 18px}
    main{min-width:0;padding:18px 22px 22px}.form-card{padding:25px 40px 22px;border:1px solid #dfebf6;border-radius:14px;background:#ffffffed;box-shadow:0 8px 26px #1d3f6708}.page-title{margin:0 0 16px;font-size:42px;line-height:1.25;font-weight:900}.intro{margin:0 0 18px;color:#7185a2;font-size:21px;font-weight:700}.rule{height:1px;margin:0 0 22px;border:0;background:#dfe8f2}.required{display:inline-flex;align-items:center;min-height:27px;padding:2px 10px;border-radius:5px;background:#ff6262;color:#fff;font-size:14px;font-weight:800}.field-label{display:flex;align-items:center;gap:16px;margin:0 0 8px;font-size:20px;font-weight:800}.control{width:100%;min-height:58px;padding:12px 18px;border:1.5px solid #cad6e5;border-radius:8px;background:#fff;color:var(--navy);font:inherit;font-size:18px;outline:none;box-shadow:inset 0 1px 2px #203c5c08}.control:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0788f51a}.control::placeholder{color:#91a2b8}.primary-fields{display:grid;gap:24px;margin-bottom:28px}.quantity-wrap{display:flex;align-items:center;gap:14px}.quantity{width:235px}.unit{color:#667d9c;font-size:20px;font-weight:700}.category{max-width:610px}.group-name{max-width:610px;margin-top:16px}.participant-heading{margin:0 0 6px;font-size:20px;font-weight:900}.participant-note{margin:0 0 16px;color:#7185a2;font-size:17px;font-weight:700}.participant-list{display:grid;gap:12px}.participant-card{display:grid;grid-template-columns:138px minmax(0,1.25fr) minmax(130px,.75fr);align-items:center;gap:20px;padding:19px 24px;border:1px solid #dce9fa;border-radius:10px;background:linear-gradient(110deg,#f5faff,#f9fcff)}.participant-number{font-size:21px;font-weight:900;white-space:nowrap}.participant-field .field-label{font-size:17px;margin-bottom:8px}.participant-field .control{min-height:58px}.add-button{width:100%;min-height:64px;margin-top:22px;border:1.5px dashed #74aaff;border-radius:8px;background:#fff;color:var(--blue);font:inherit;font-size:20px;font-weight:800;cursor:pointer}.add-button:hover{background:#f4f9ff}.plus{font-size:31px;line-height:0;vertical-align:-3px;margin-right:14px}.submit-button{width:min(100%,414px);min-height:69px;display:block;margin:28px auto 0;border:0;border-radius:9px;background:linear-gradient(100deg,#0db9b1,#08aaa8);color:#fff;font:inherit;font-size:22px;font-weight:800;cursor:pointer}.submit-button:hover{filter:brightness(1.05)}.message{min-height:22px;margin:10px 0 0;color:#078568;text-align:center;font-weight:700}.group-field[hidden]{display:none}
    @media(max-width:1000px){.layout{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding:26px 8px}.nav-link{padding:0 16px;font-size:16px;gap:13px}.form-card{padding:22px}.participant-card{grid-template-columns:110px minmax(0,1.2fr) minmax(120px,.8fr);gap:12px;padding:16px}.page-title{font-size:36px}}
    @media(max-width:700px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:16px 6px}.user-badge{padding:0 5px 17px;justify-content:center}.user-badge .avatar{width:36px;height:36px}.user-badge span{display:none}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:13px 5px}main{padding:12px 10px 20px}.form-card{padding:18px 14px}.page-title{font-size:30px;margin-bottom:10px}.intro{font-size:16px;margin-bottom:14px}.rule{margin-bottom:18px}.primary-fields{gap:18px;margin-bottom:23px}.field-label{font-size:17px;gap:10px}.required{min-height:22px;padding:2px 8px;font-size:12px}.control{min-height:50px;padding:10px 13px;font-size:16px}.quantity{width:160px}.unit{font-size:17px}.participant-heading{font-size:17px}.participant-note{font-size:14px}.participant-card{grid-template-columns:1fr 1fr;gap:12px;padding:14px}.participant-number{grid-column:1/-1;font-size:18px}.participant-field .field-label{font-size:15px}.participant-field .control{min-height:48px}.add-button{min-height:54px;margin-top:15px;font-size:17px}.submit-button{min-height:58px;margin-top:19px;font-size:18px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <section class="form-card" aria-labelledby="pageTitle">
        <h1 class="page-title" id="pageTitle">参加申し込み</h1>
        <p class="intro">参加情報を入力してください。</p>
        <hr class="rule">
        <form id="applicationForm">
          <div class="primary-fields">
            <div class="field">
              <label class="field-label" for="participantCount">参加人数 <span class="required">必須</span></label>
              <div class="quantity-wrap"><input class="control quantity" id="participantCount" name="participantCount" type="number" min="1" value="1" required><span class="unit">人</span></div>
            </div>
            <div class="field">
              <label class="field-label" for="participantType">参加者区分 <span class="required">必須</span></label>
              <select class="control category" id="participantType" name="participantType" required><option value="">選択してください</option><option value="individual">個人</option><option value="family">家族</option><option value="group">団体</option></select>
              <div class="group-field" id="groupField" hidden><label class="field-label" for="groupName" style="margin-top:16px">団体名（任意）</label><input class="control category" id="groupName" name="groupName" placeholder="団体名を入力してください"></div>
            </div>
          </div>
          <h2 class="participant-heading">参加者情報 <span class="required">必須</span></h2>
          <p class="participant-note">参加人数分の氏名・年齢を入力してください。</p>
          <div class="participant-list" id="participantList"></div>
          <button class="add-button" id="addParticipant" type="button"><span class="plus" aria-hidden="true">＋</span>参加者を追加</button>
          <button class="submit-button" type="submit">申し込む</button>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>
  <script>
    const countInput = document.getElementById('participantCount');
    const participantList = document.getElementById('participantList');
    function renderParticipants(count) {
      const safeCount = Math.max(1, Number(count) || 1);
      countInput.value = safeCount;
      const previous = Array.from(participantList.querySelectorAll('.participant-card')).map(card => ({
        name: card.querySelector('[name="participantName[]"]').value,
        age: card.querySelector('[name="participantAge[]"]').value
      }));
      participantList.innerHTML = '';
      for (let i = 0; i < safeCount; i++) {
        const values = previous[i] || {name:'', age:''};
        const card = document.createElement('div');
        card.className = 'participant-card';
        card.innerHTML = `<div class="participant-number">参加者 ${i + 1}</div>
          <div class="participant-field"><label class="field-label">氏名 <span class="required">必須</span></label><input class="control" name="participantName[]" required autocomplete="off" aria-label="参加者 ${i + 1} の氏名" value="${values.name.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></div>
          <div class="participant-field"><label class="field-label">年齢 <span class="required">必須</span></label><div class="quantity-wrap"><input class="control" name="participantAge[]" type="number" min="0" required aria-label="参加者 ${i + 1} の年齢" value="${values.age}"><span class="unit">歳</span></div></div>`;
        participantList.appendChild(card);
      }
    }
    countInput.addEventListener('change', () => renderParticipants(countInput.value));
    document.getElementById('addParticipant').addEventListener('click', () => renderParticipants(Number(countInput.value) + 1));
    document.getElementById('participantType').addEventListener('change', event => {
      document.getElementById('groupField').hidden = event.target.value !== 'group';
    });
    document.getElementById('applicationForm').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('message').textContent = '申し込み内容を受け付けました（画面見本）';
    });
    renderParticipants(1);
  </script>
</body>
</html>
