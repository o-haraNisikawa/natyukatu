<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>申し込み管理 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--teal:#08aaa8;--red:#fa343b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 26px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:25px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:27px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 26px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:300px minmax(0,1fr)}.sidebar{padding:32px 12px;background:#ffffff80;border-right:1px solid var(--line)}.user-badge{display:flex;align-items:center;gap:14px;padding:0 18px 22px;font-size:18px;font-weight:800}.user-badge .avatar{width:46px;height:46px}.nav{display:grid;gap:7px}.nav-link{height:61px;display:flex;align-items:center;gap:19px;padding:0 24px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:14px 18px}
    main{min-width:0;padding:18px 22px 22px}.content-card{width:100%;min-height:calc(100vh - 118px);padding:20px 28px;border:1px solid #e5eef8;border-radius:14px;background:#ffffffed;box-shadow:0 8px 26px #1d3f6708}.page-title{margin:0 0 28px;font-size:36px;line-height:1.3;font-weight:900}.section-title{margin:0 0 8px;font-size:28px;font-weight:900}.description{margin:0 0 18px;color:#7085a2;font-size:18px;font-weight:700}.table-wrap{overflow-x:auto;border:1px solid #dce6f2;border-radius:8px}table{width:100%;min-width:850px;border-collapse:collapse;table-layout:fixed}thead{background:linear-gradient(100deg,#edf5fd,#eaf4fc)}th{height:76px;padding:14px 20px;text-align:center;font-size:18px;font-weight:900;border-right:1px solid #dfe8f2}th:last-child,td:last-child{border-right:0}td{height:87px;padding:12px 18px;text-align:center;border-top:1px solid #e1e9f2;border-right:1px solid #e1e9f2;font-size:18px;font-weight:700}tbody tr:first-child td{border-top:0}.applicant{text-align:left;padding-left:36px}.placeholder{font-weight:700;color:var(--navy)}.review-actions{display:flex;justify-content:center;gap:10px}.review-button{width:82px;min-height:52px;border:1.5px solid var(--red);border-radius:8px;background:#fff;color:var(--red);font:inherit;font-size:20px;font-weight:900;cursor:pointer}.review-button.approve{border-color:var(--teal);background:linear-gradient(100deg,#0db9b1,#08aaa8);color:white}.review-button:hover{filter:brightness(1.05)}.reviewed{font-weight:900}.reviewed.approved{color:var(--teal)}.reviewed.declined{color:var(--red)}.result{min-height:24px;margin:14px 4px 0;color:#078568;font-weight:700}
    @media(max-width:900px){.layout{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding:26px 8px}.nav-link{padding:0 16px;font-size:16px;gap:13px}.content-card{padding:20px}.page-title{font-size:32px}}
    @media(max-width:700px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:16px 6px}.user-badge{padding:0 5px 17px;justify-content:center}.user-badge .avatar{width:36px;height:36px}.user-badge span{display:none}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:13px 5px}main{padding:12px 10px}.content-card{min-height:calc(100vh - 98px);padding:17px 12px}.page-title{font-size:28px;margin-bottom:23px}.section-title{font-size:22px}.description{font-size:15px}.table-wrap{margin-top:12px}th{height:60px;font-size:15px;padding:10px}td{height:73px;font-size:15px;padding:8px}.applicant{padding-left:15px}.review-actions{gap:6px}.review-button{width:52px;min-height:43px;font-size:17px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
        <a class="nav-link active" href="application-management.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg><span>申し込み受付管理</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <section class="content-card" aria-labelledby="pageTitle">
        <h1 class="page-title" id="pageTitle">申し込み管理</h1>
        <h2 class="section-title">参加者一覧</h2>
        <p class="description">申込内容を確認し、可否を選択してください。</p>
        <div class="table-wrap">
          <table>
            <colgroup><col style="width:15%"><col style="width:16%"><col style="width:14%"><col style="width:30%"><col style="width:25%"></colgroup>
            <thead><tr><th scope="col">申込者</th><th scope="col">参加者区分</th><th scope="col">参加人数</th><th scope="col">申込内容</th><th scope="col">審査</th></tr></thead>
            <tbody>
              <tr><td class="applicant">申込者A</td><td>－</td><td>－</td><td>－</td><td><div class="review-actions"><button class="review-button approve" type="button">可</button><button class="review-button" type="button">否</button></div></td></tr>
              <tr><td class="applicant">申込者B</td><td>－</td><td>－</td><td>－</td><td><div class="review-actions"><button class="review-button approve" type="button">可</button><button class="review-button" type="button">否</button></div></td></tr>
              <tr><td class="applicant">申込者C</td><td>－</td><td>－</td><td>－</td><td><div class="review-actions"><button class="review-button approve" type="button">可</button><button class="review-button" type="button">否</button></div></td></tr>
            </tbody>
          </table>
        </div>
        <p class="result" id="result" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    document.querySelectorAll('.review-actions').forEach(actions => {
      actions.querySelectorAll('.review-button').forEach(button => {
        button.addEventListener('click', () => {
          const row = actions.closest('tr');
          const decision = button.textContent.trim() === '可' ? '承認' : '否認';
          const resultCell = document.createElement('span');
          resultCell.className = 'reviewed ' + (decision === '承認' ? 'approved' : 'declined');
          resultCell.textContent = decision;
          actions.replaceWith(resultCell);
          document.getElementById('result').textContent = row.cells[0].textContent + 'を' + decision + 'しました（画面見本）';
        });
      });
    });
  </script>
</body>
</html>
