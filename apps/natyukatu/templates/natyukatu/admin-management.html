<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者用画面 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--teal:#08aaa8;--red:#fa343b;--muted:#cbd7e5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 26px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:25px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:27px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.admin-label{margin-right:16px;padding:8px 13px;border-radius:18px;background:#e8f3ff;color:#1263b5;font-weight:900;white-space:nowrap}.account{display:flex;align-items:center;gap:13px;padding:0 22px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb;flex:none}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:300px minmax(0,1fr)}.sidebar{padding:30px 12px;background:#ffffff80;border-right:1px solid var(--line)}.nav{display:grid;gap:8px}.nav-link{height:60px;display:flex;align-items:center;gap:18px;padding:0 24px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:800;text-decoration:none}.nav-link.active{background:#e8f3ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:18px 18px}
    main{min-width:0;padding:24px 24px 32px}.page-title{margin:0 0 20px 3px;font-size:43px;line-height:1.22;font-weight:900}.admin-card{min-height:calc(100vh - 168px);padding:20px 28px;border:1.5px solid #dce9f9;border-radius:14px;background:#ffffffdf;box-shadow:0 5px 20px #1d3f6705}.tabs{display:flex;gap:8px;border-bottom:2px solid #dbe6f3}.tab{position:relative;min-width:284px;height:66px;display:flex;align-items:center;justify-content:center;gap:16px;border:0;border-radius:9px 9px 0 0;background:transparent;color:#314d70;font:inherit;font-size:21px;font-weight:900;cursor:pointer}.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab.active{background:#e8f3ff;color:var(--blue)}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;border-radius:4px;background:var(--blue)}.search-panel{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(280px,1.4fr) 185px;align-items:end;gap:26px;margin:22px 0;padding:17px 22px 19px;border:1.5px solid #dce9f9;border-radius:10px;background:#ffffffa8}.field-label{display:block;margin:0 0 9px;font-size:18px;font-weight:900}.control{width:100%;height:60px;padding:0 18px;border:1.5px solid #bdcde1;border-radius:8px;background:#fff;color:var(--navy);font:inherit;font-size:18px;outline:none}.control:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0788f51a}.control::placeholder{color:#7188a8}.search-button{height:60px;display:flex;align-items:center;justify-content:center;gap:13px;border:0;border-radius:8px;background:linear-gradient(100deg,#0db9b1,#08aaa8);color:#fff;font:inherit;font-size:19px;font-weight:900;cursor:pointer}.search-button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}.list-title{margin:14px 0 12px;font-size:27px;font-weight:900}.table-wrap{overflow:auto;border:1.5px solid #cbdcf2;border-radius:9px}table{width:100%;min-width:790px;border-collapse:collapse;table-layout:fixed}thead{background:linear-gradient(100deg,#eaf3fd,#edf5fd)}th{height:58px;padding:12px 17px;text-align:left;font-size:17px;font-weight:900;border-right:1px solid #d9e5f2}th:last-child,td:last-child{border-right:0}td{height:60px;padding:9px 17px;border-top:1px solid #dfe8f2;border-right:1px solid #dfe8f2;font-size:16px;font-weight:700}tbody tr:first-child td{border-top:0}.skeleton{display:block;width:min(100%,190px);height:25px;border-radius:6px;background:linear-gradient(100deg,#dce3eb,#cbd6e2)}.skeleton.short{width:72px}.skeleton.medium{width:164px}.delete-button{width:122px;height:42px;border:1.5px solid var(--red);border-radius:7px;background:#fff;color:#e9272e;font:inherit;font-size:16px;font-weight:900;cursor:pointer}.delete-button:hover{background:#fff5f5}.status{min-height:22px;margin:10px 2px 0;color:#087d72;font-weight:700}.list-panel[hidden]{display:none}
    @media(max-width:1000px){.layout{grid-template-columns:235px minmax(0,1fr)}.sidebar{padding:25px 8px}.nav-link{padding:0 16px;font-size:16px;gap:13px}main{padding:22px 16px}.admin-card{padding:18px}.search-panel{grid-template-columns:minmax(150px,.8fr) minmax(220px,1.3fr) 140px;gap:14px;padding:15px}.tab{min-width:220px}.page-title{font-size:38px}}
    @media(max-width:700px){.topbar{height:74px;padding:0 13px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.admin-label{margin-right:8px;padding:6px 8px;font-size:13px}.account{padding:0;border:0}.account .avatar,.account .chevron{display:none}.account span{font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis}.logout{min-width:84px;padding:8px 9px;font-size:13px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:15px 5px}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:13px 4px}main{padding:18px 10px}.page-title{font-size:29px;margin-bottom:15px}.admin-card{min-height:calc(100vh - 120px);padding:12px 10px}.tabs{gap:4px}.tab{min-width:0;flex:1;height:55px;gap:7px;font-size:15px}.tab svg{width:21px;height:21px}.search-panel{grid-template-columns:1fr;gap:12px;margin:14px 0;padding:13px}.field-label{font-size:15px;margin-bottom:6px}.control{height:48px;font-size:15px}.search-button{height:48px}.list-title{font-size:21px;margin-top:12px}.table-wrap{margin-right:0}th{height:49px;font-size:14px;padding:8px 10px}td{height:53px;font-size:14px;padding:7px 10px}.delete-button{width:82px;height:36px;font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面"><svg class="logo" viewBox="0 0 90 64" aria-hidden="true"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs><path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#lb)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#lt)"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/></svg><span class="brand-title">画面タイトル</span></a>
    <div class="spacer"></div><span class="admin-label">管理者</span><div class="account"><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron"></i></div><a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="管理メニュー"><nav class="nav">
      <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H4v-9Z"/></svg><span>トップ画面</span></a>
      <a class="nav-link active" href="admin-management.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.5-4 2.8-6 7-6 2.5 0 4.4.6 5.7 1.8M16 11a3.5 3.5 0 1 0 0-7M16 15c3.7 0 5.7 2 6 6"/></svg><span>ユーザー管理</span></a>
      <a class="nav-link" href="#recruitment"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg><span>募集管理</span></a>
    </nav><div class="divider"></div><a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a></aside>
    <main>
      <h1 class="page-title">管理者用画面</h1>
      <section class="admin-card">
        <div class="tabs" role="tablist" aria-label="管理対象">
          <button class="tab active" id="usersTab" role="tab" aria-selected="true" aria-controls="usersPanel"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.5-4 2.8-6 7-6s6.5 2 7 6M16 11a3.5 3.5 0 1 0 0-7M16 15c3.7 0 5.7 2 6 6"/></svg>ユーザー一覧</button>
          <button class="tab" id="recruitmentTab" role="tab" aria-selected="false" aria-controls="recruitmentPanel"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>募集一覧</button>
        </div>
        <section class="list-panel" id="usersPanel" role="tabpanel" aria-labelledby="usersTab">
          <form class="search-panel" id="userSearch">
            <div><label class="field-label" for="userTarget">管理対象</label><select class="control" id="userTarget"><option>参加者</option><option>募集者</option></select></div>
            <div><label class="field-label" for="userKeyword">ユーザーID・名前で検索</label><input class="control" id="userKeyword" placeholder="ユーザーID・名前を入力してください"></div>
            <button class="search-button" type="submit"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>検索</button>
          </form>
          <h2 class="list-title">管理対象一覧</h2>
          <div class="table-wrap"><table><colgroup><col style="width:22%"><col style="width:28%"><col style="width:13%"><col style="width:21%"><col style="width:16%"></colgroup><thead><tr><th>ユーザーID</th><th>ユーザーニックネーム</th><th>年齢</th><th>称号</th><th>操作</th></tr></thead><tbody>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton short"></i></td><td><i class="skeleton medium"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton short"></i></td><td><i class="skeleton medium"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton short"></i></td><td><i class="skeleton medium"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton short"></i></td><td><i class="skeleton medium"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton short"></i></td><td><i class="skeleton medium"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
          </tbody></table></div>
        </section>
        <section class="list-panel" id="recruitmentPanel" role="tabpanel" aria-labelledby="recruitmentTab" hidden>
          <form class="search-panel" id="recruitmentSearch">
            <div><label class="field-label" for="recruitmentTarget">管理対象</label><select class="control" id="recruitmentTarget"><option>募集</option></select></div>
            <div><label class="field-label" for="recruitmentKeyword">募集名で検索</label><input class="control" id="recruitmentKeyword" placeholder="募集名を入力してください"></div>
            <button class="search-button" type="submit"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>検索</button>
          </form>
          <h2 class="list-title">募集一覧</h2>
          <div class="table-wrap"><table><colgroup><col style="width:20%"><col style="width:28%"><col style="width:20%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr><th>募集ID</th><th>募集名</th><th>募集者</th><th>状態</th><th>操作</th></tr></thead><tbody>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton"></i></td><td><i class="skeleton short"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton"></i></td><td><i class="skeleton short"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton"></i></td><td><i class="skeleton short"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton"></i></td><td><i class="skeleton short"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
            <tr><td><i class="skeleton"></i></td><td><i class="skeleton medium"></i></td><td><i class="skeleton"></i></td><td><i class="skeleton short"></i></td><td><button class="delete-button" type="button">削除</button></td></tr>
          </tbody></table></div>
        </section>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    const usersTab=document.getElementById('usersTab'), recruitmentTab=document.getElementById('recruitmentTab');
    function showPanel(panelName){
      const users=panelName==='users';
      usersTab.classList.toggle('active',users);recruitmentTab.classList.toggle('active',!users);
      usersTab.setAttribute('aria-selected',String(users));recruitmentTab.setAttribute('aria-selected',String(!users));
      document.getElementById('usersPanel').hidden=!users;document.getElementById('recruitmentPanel').hidden=users;
      document.getElementById('status').textContent='';
    }
    usersTab.addEventListener('click',()=>showPanel('users'));recruitmentTab.addEventListener('click',()=>showPanel('recruitment'));
    document.querySelectorAll('.search-panel').forEach(form=>form.addEventListener('submit',event=>{event.preventDefault();document.getElementById('status').textContent='検索条件に合わせて一覧を表示します（画面見本）';}));
    document.querySelectorAll('.delete-button').forEach(button=>button.addEventListener('click',()=>{if(confirm('この対象を削除しますか？（画面見本）'))document.getElementById('status').textContent='削除操作を選択しました（画面見本）';}));
  </script>
</body>
</html>
