{% extends "natyukatu/base.html" %}

{% block content %}
<section class="complete-card" aria-labelledby="completeTitle">
  <div class="success-mark" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <path d="m10 34 15 15L55 17"></path>
    </svg>
  </div>

  <h1 class="complete-title" id="completeTitle">
    ユーザー情報変更完了
  </h1>

  <p class="message">
    ユーザー情報を変更しました。
  </p>

  <a
    class="return-link"
    href="{{ url_for('natyukatu.userDetail') }}"
  >
    ユーザー管理画面へ
  </a>
</section>
{% endblock %}
