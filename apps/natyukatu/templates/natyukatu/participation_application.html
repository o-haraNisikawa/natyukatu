<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>natyukatu</title>
  
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="user-badge"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <section class="form-card" aria-labelledby="pageTitle">
        <h1 class="page-title" id="pageTitle">参加申し込み</h1>
        <p class="intro">参加情報を入力してください。</p>
        <hr class="rule">
        <form id="applicationForm">
          <div class="primary-fields">
            <div class="field">
              <label class="field-label" for="participantCount">参加人数 <span class="required">必須</span></label>
              <div class="quantity-wrap"><input class="control quantity" id="participantCount" name="participantCount" type="number" min="1" value="1" required><span class="unit">人</span></div>
            </div>
            <div class="field">
              <label class="field-label" for="participantType">参加者区分 <span class="required">必須</span></label>
              <select class="control category" id="participantType" name="participantType" required><option value="">選択してください</option><option value="individual">個人</option><option value="family">家族</option><option value="group">団体</option></select>
              <div class="group-field" id="groupField" hidden><label class="field-label" for="groupName" style="margin-top:16px">団体名（任意）</label><input class="control category" id="groupName" name="groupName" placeholder="団体名を入力してください"></div>
            </div>
          </div>
          <h2 class="participant-heading">参加者情報 <span class="required">必須</span></h2>
          <p class="participant-note">参加人数分の氏名・年齢を入力してください。</p>
          <div class="participant-list" id="participantList"></div>
          <button class="add-button" id="addParticipant" type="button"><span class="plus" aria-hidden="true">＋</span>参加者を追加</button>
          <button class="submit-button" type="submit">申し込む</button>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>
  <script>
    const countInput = document.getElementById('participantCount');
    const participantList = document.getElementById('participantList');
    function renderParticipants(count) {
      const safeCount = Math.max(1, Number(count) || 1);
      countInput.value = safeCount;
      const previous = Array.from(participantList.querySelectorAll('.participant-card')).map(card => ({
        name: card.querySelector('[name="participantName[]"]').value,
        age: card.querySelector('[name="participantAge[]"]').value
      }));
      participantList.innerHTML = '';
      for (let i = 0; i < safeCount; i++) {
        const values = previous[i] || {name:'', age:''};
        const card = document.createElement('div');
        card.className = 'participant-card';
        card.innerHTML = `<div class="participant-number">参加者 ${i + 1}</div>
          <div class="participant-field"><label class="field-label">氏名 <span class="required">必須</span></label><input class="control" name="participantName[]" required autocomplete="off" aria-label="参加者 ${i + 1} の氏名" value="${values.name.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></div>
          <div class="participant-field"><label class="field-label">年齢 <span class="required">必須</span></label><div class="quantity-wrap"><input class="control" name="participantAge[]" type="number" min="0" required aria-label="参加者 ${i + 1} の年齢" value="${values.age}"><span class="unit">歳</span></div></div>`;
        participantList.appendChild(card);
      }
    }
    countInput.addEventListener('change', () => renderParticipants(countInput.value));
    document.getElementById('addParticipant').addEventListener('click', () => renderParticipants(Number(countInput.value) + 1));
    document.getElementById('participantType').addEventListener('change', event => {
      document.getElementById('groupField').hidden = event.target.value !== 'group';
    });
    document.getElementById('applicationForm').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('message').textContent = '申し込み内容を受け付けました（画面見本）';
    });
    renderParticipants(1);
  </script>
</body>
</html>
