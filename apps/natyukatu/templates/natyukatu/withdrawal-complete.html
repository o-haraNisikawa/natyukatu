<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>退会完了 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 30px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:28px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:28px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.login-link{min-width:140px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;color:var(--blue);background:#fff;font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:240px minmax(0,1fr)}.empty-rail{border-right:1px solid var(--line);background:#ffffff45}main{display:grid;place-items:center;padding:40px 28px}.complete-card{width:min(100%,820px);min-height:490px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 30px;border:1.5px solid #d9e2ed;border-radius:10px;background:#ffffffeb;box-shadow:0 8px 25px #1d3f6707;text-align:center}.success-mark{width:106px;height:106px;display:grid;place-items:center;margin-bottom:30px;border-radius:50%;background:linear-gradient(135deg,#def7f5,#e9faf8)}.success-mark svg{width:57px;height:57px;fill:none;stroke:#05aaa5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.complete-title{margin:0 0 24px;font-size:40px;line-height:1.3;font-weight:800}.message{margin:0 0 46px;font-size:23px;font-weight:600}.top-link{width:min(100%,310px);min-height:70px;display:grid;place-items:center;padding:14px 24px;border-radius:9px;color:#fff;background:linear-gradient(100deg,#087df0,#0789e9);font-size:21px;font-weight:800;text-decoration:none;transition:filter .15s}.top-link:hover{filter:brightness(1.06)}
    @media(max-width:650px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.login-link{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:36px minmax(0,1fr)}main{padding:24px 14px}.complete-card{min-height:390px;padding:36px 18px}.success-mark{width:82px;height:82px;margin-bottom:25px}.success-mark svg{width:46px;height:46px}.complete-title{font-size:30px;margin-bottom:18px}.message{font-size:18px;margin-bottom:36px}.top-link{min-height:58px;font-size:18px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <a class="login-link" href="login.html">ログイン</a>
  </header>
  <div class="layout">
    <aside class="empty-rail" aria-hidden="true"></aside>
    <main>
      <section class="complete-card" aria-labelledby="completeTitle">
        <div class="success-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="m10 34 15 15L55 17"/></svg></div>
        <h1 class="complete-title" id="completeTitle">退会完了</h1>
        <p class="message">退会処理が完了しました。</p>
        <a class="top-link" href="top.html">トップ画面へ</a>
      </section>
    </main>
  </div>
</body>
</html>
