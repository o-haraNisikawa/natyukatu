{% extends "natyukatu/base.html" %}

{% block content %}

    <div class="success-mark">
      <svg viewBox="0 0 64 64">
        <path d="m10 34 15 15L55 17"></path>
      </svg>
    </div>
  </div>

  <h1 class="complete-title" id="completeTitle">
    募集情報削除完了

  <p class="message">
    募集を削除しました。

  <a
    class="top-link"
    href="{{ url_for('natyukatu.index') }}"
  >
    トップ画面へ
  </a>
</section>
{% endblock %}
