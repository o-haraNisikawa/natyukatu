<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>募集履歴 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--red:#ef3030}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:94px;display:flex;align-items:center;padding:0 30px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:28px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:28px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 28px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 94px);display:grid;grid-template-columns:285px minmax(0,1fr)}.sidebar{padding:36px 12px;background:#ffffff80;border-right:1px solid var(--line)}.side-caption{padding:8px 18px 22px;color:#8092aa;font-weight:700}.nav{display:grid;gap:8px}.nav-link{height:61px;display:flex;align-items:center;gap:20px;padding:0 25px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:20px 18px}
    main{min-width:0;padding:34px 28px 44px}.page-title{margin:0 0 22px 4px;font-size:38px;line-height:1.25;font-weight:800}.history-card{overflow:hidden;border:1px solid #e0e8f1;border-radius:9px;background:#ffffffed;box-shadow:0 8px 26px #1d3f6708}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1160px;table-layout:fixed}th,td{border-right:1px solid #dfe7ef;border-bottom:1px solid #dfe7ef;text-align:left}th:last-child,td:last-child{border-right:0}thead{background:linear-gradient(100deg,#eef2f6,#f3f6f9)}th{height:55px;padding:10px 16px;font-size:17px;font-weight:800;white-space:nowrap}td{height:87px;padding:12px 14px;font-size:15px;font-weight:700;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.date-col{width:155px}.name-col{width:200px}.detail-col{width:165px}.status-col{width:100px}.change-col{width:230px}.actions-col{width:380px}.skeleton{display:block;height:22px;border-radius:5px;background:linear-gradient(110deg,#dce2e9,#cfd7e0,#dce2e9)}.date-skeleton{width:122px}.name-skeleton{width:156px}.status-skeleton{width:60px;height:26px;border-radius:18px;background:linear-gradient(110deg,#bfc7d1,#aeb7c3)}.detail-link{color:var(--blue);font-size:15px;font-weight:800;text-decoration:underline;text-underline-offset:3px}.state-control{display:flex;align-items:center;gap:9px}.state-select{width:132px;height:39px;padding:0 9px;border:1.5px solid #9eb0c6;border-radius:6px;background:#fff;color:#60728b;font:inherit;font-size:14px}.small-button,.action-link{min-height:38px;display:inline-grid;place-items:center;padding:7px 12px;border:1.5px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue);font:inherit;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}.row-actions{display:flex;align-items:center;gap:9px}.action-link.delete{border-color:#ff4242;color:#ed2727}.small-button:hover,.action-link:hover{background:#f2f8ff}.delete:hover{background:#fff4f4!important}.result{min-height:24px;margin:12px 4px 0;color:#078568;font-weight:700}
    @media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:28px 9px}.nav-link{padding:0 16px;font-size:16px;gap:14px}main{padding:28px 18px}}
    @media(max-width:650px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:20px 6px}.side-caption{padding:7px 5px 18px;font-size:11px;overflow:hidden}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:15px 5px}main{padding:22px 12px}.page-title{font-size:30px;margin-bottom:18px}.history-card{border-radius:7px}th{font-size:15px}.result{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="side-caption">称号</div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <h1 class="page-title">募集履歴</h1>
      <section class="history-card" aria-label="募集履歴一覧">
        <div class="table-wrap">
          <table>
            <colgroup><col class="date-col"><col class="name-col"><col class="detail-col"><col class="status-col"><col class="change-col"><col class="actions-col"></colgroup>
            <thead><tr><th scope="col">開催日時</th><th scope="col">募集名</th><th scope="col">詳細</th><th scope="col">状態</th><th scope="col">状態変更</th><th scope="col">操作</th></tr></thead>
            <tbody>
              <tr>
                <td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る　›</a></td><td><span class="skeleton status-skeleton" aria-label="募集状態"></span></td>
                <td><div class="state-control"><select class="state-select" aria-label="1件目の募集状態"><option value="">状態を選択</option><option>公開中</option><option>非公開</option><option>終了</option></select><button class="small-button update-row" type="button">更新</button></div></td>
                <td><div class="row-actions"><a class="action-link" href="recruitment-change.html">募集情報変更</a><a class="action-link delete" href="recruitment-delete.html">活動削除</a><a class="action-link" href="application-management.html">申込受付管理</a></div></td>
              </tr>
              <tr>
                <td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る　›</a></td><td><span class="skeleton status-skeleton" aria-label="募集状態"></span></td>
                <td><div class="state-control"><select class="state-select" aria-label="2件目の募集状態"><option value="">状態を選択</option><option>公開中</option><option>非公開</option><option>終了</option></select><button class="small-button update-row" type="button">更新</button></div></td>
                <td><div class="row-actions"><a class="action-link" href="recruitment-change.html">募集情報変更</a><a class="action-link delete" href="recruitment-delete.html">活動削除</a><a class="action-link" href="application-management.html">申込受付管理</a></div></td>
              </tr>
              <tr>
                <td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る　›</a></td><td><span class="skeleton status-skeleton" aria-label="募集状態"></span></td>
                <td><div class="state-control"><select class="state-select" aria-label="3件目の募集状態"><option value="">状態を選択</option><option>公開中</option><option>非公開</option><option>終了</option></select><button class="small-button update-row" type="button">更新</button></div></td>
                <td><div class="row-actions"><a class="action-link" href="recruitment-change.html">募集情報変更</a><a class="action-link delete" href="recruitment-delete.html">活動削除</a><a class="action-link" href="application-management.html">申込受付管理</a></div></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <p class="result" id="result" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script>
    document.querySelectorAll('.update-row').forEach((button) => {
      button.addEventListener('click', () => {
        const select = button.parentElement.querySelector('select');
        const result = document.getElementById('result');
        if (!select.value) {
          result.textContent = '状態を選択してください。';
          return;
        }
        const row = button.closest('tr');
        row.querySelector('.status-skeleton').className = 'status';
        row.querySelector('.status').textContent = select.value;
        result.textContent = '募集状態を更新しました（画面見本）';
      });
    });
  </script>
</body>
</html>
