<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー情報表示 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--muted:#c2d0e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:80px;display:flex;align-items:center;padding:0 28px;background:#ffffffed;border-bottom:1px solid #e7eef6;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;color:inherit;text-decoration:none}.logo{width:70px;height:52px}.brand-title{margin-left:22px;padding-left:24px;border-left:2px solid #e3eaf3;font-size:25px;font-weight:800}.spacer{flex:1}.account{display:flex;align-items:center;gap:12px;padding:0 24px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar-small{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#e7f0fb}.avatar-small svg{width:25px;fill:none;stroke:#2478c7;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:138px;padding:11px 20px;border:1.5px solid var(--blue);border-radius:8px;color:var(--blue);background:white;text-align:center;text-decoration:none;font-weight:800}
    .layout{min-height:calc(100vh - 80px);display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{padding:24px 10px;background:#ffffff80;border-right:1px solid var(--line)}.nav{display:grid;gap:5px}.nav-link{height:51px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:8px;color:var(--navy);font-size:16px;font-weight:800;text-decoration:none}.nav-link svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.nav-link.active{background:#e8f3ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.divider{height:1px;background:var(--line);margin:13px 14px}
    main{padding:28px 26px}.title-row{display:flex;align-items:center;gap:20px;margin:0 0 22px}.page-title{margin:0;font-size:36px;font-weight:900}.profile-card{padding:28px 22px 8px;border:1px solid #dce9f9;border-radius:12px;background:#ffffffed;box-shadow:0 8px 24px #1d3f6708}.portrait-area{display:flex;justify-content:center;padding:0 0 20px;border-bottom:1px solid #e1eaf3}.portrait{width:180px;height:180px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#e1edfb,#e8f2fc)}.portrait svg{width:120px;height:120px;fill:#91aaca}.profile-row{min-height:74px;display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center;padding:0 8px;border-bottom:1px solid #e1eaf3}.profile-row:last-child{border-bottom:0}.label{font-size:19px;font-weight:900}.value-placeholder{display:block;height:24px;border-radius:7px;background:linear-gradient(100deg,#c9d6e7,#b9c9dd);max-width:300px}.value-placeholder.short{max-width:112px}
    @media(max-width:760px){.topbar{height:70px;padding:0 13px}.logo{width:48px;height:40px}.brand-title{margin-left:12px;padding-left:12px;font-size:17px}.account{display:none}.logout{min-width:90px;padding:8px 11px}.layout{min-height:calc(100vh - 70px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:14px 5px}.nav-link{height:45px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:11px 4px}main{padding:20px 12px}.page-title{font-size:27px}.profile-card{padding:18px 12px 5px}.portrait{width:130px;height:130px}.portrait svg{width:88px;height:88px}.profile-row{min-height:62px;grid-template-columns:minmax(125px,48%) minmax(0,1fr);padding:0 3px}.label{font-size:15px}.value-placeholder{height:20px;width:90%}.title-row{margin-bottom:16px}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="top.html" aria-label="トップ画面"><svg class="logo" viewBox="0 0 90 64" aria-hidden="true"><defs><linearGradient id="lb2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="lt2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs><path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#lb2)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#lt2)"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/></svg><span class="brand-title">画面タイトル</span></a><div class="spacer"></div><div class="account"><span class="avatar-small"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron"></i></div><a class="logout" href="logout-confirm.html">ログアウト</a></header>
  <div class="layout"><aside class="sidebar" aria-label="メインメニュー"><nav class="nav">
    <a class="nav-link" href="#title"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg><span>称号</span></a>
    <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H4v-9Z"/></svg><span>トップ画面</span></a>
    <a class="nav-link" href="activity.html"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.5a2.5 2.5 0 0 1-1-2Z"/></svg><span>活動用画面</span></a>
    <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
    <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
    <a class="nav-link" href="recruitment-register.html"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg><span>新規募集登録</span></a>
  </nav><div class="divider"></div><a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a></aside>
    <main><div class="title-row"><h1 class="page-title">ユーザー情報表示</h1></div><section class="profile-card" aria-label="ユーザー情報"><div class="portrait-area"><div class="portrait" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="38" r="24"/><path d="M15 111c2-27 17-42 45-42s43 15 45 42Z"/></svg></div></div><div class="profile-row"><span class="label">ユーザーニックネーム</span><span class="value-placeholder"></span></div><div class="profile-row"><span class="label">名前</span><span class="value-placeholder" style="max-width:210px"></span></div><div class="profile-row"><span class="label">年齢</span><span class="value-placeholder short"></span></div><div class="profile-row" id="title"><span class="label">称号</span><span class="value-placeholder"></span></div></section></main>
  </div>
</body>
</html>
