<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--gold:#e5b21b;--silver:#8b99aa;--bronze:#b97843}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:96px;display:flex;align-items:center;padding:0 26px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:25px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:27px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 26px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb;flex:none}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 96px);display:grid;grid-template-columns:300px minmax(0,1fr)}.sidebar{padding:32px 12px;background:#ffffff80;border-right:1px solid var(--line)}.user-badge{display:flex;align-items:center;gap:14px;padding:0 18px 22px;font-size:18px;font-weight:800}.user-badge .avatar{width:46px;height:46px}.nav{display:grid;gap:7px}.nav-link{height:61px;display:flex;align-items:center;gap:19px;padding:0 24px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:14px 18px}
    main{min-width:0;padding:28px 26px 38px}.page-title{margin:0 0 23px 3px;font-size:48px;line-height:1.2;font-weight:900}.filter-card,.ranking-card{border:1.5px solid #dce9f9;border-radius:14px;background:#ffffffdf;box-shadow:0 5px 20px #1d3f6705}.filter-card{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:30px 34px}.filter-label{display:block;margin:0 0 12px;font-size:23px;font-weight:900}.select{width:100%;height:66px;padding:0 22px;border:1.5px solid #bdcde1;border-radius:9px;background:#fff;color:#526d91;font:inherit;font-size:20px;outline:none}.select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0788f51a}.ranking-card{margin-top:26px;padding:23px 32px 34px}.section-title{margin:0 0 23px;font-size:34px;font-weight:900}.table-wrap{overflow:auto;border:1.5px solid #cbdcf2;border-radius:9px}table{width:100%;min-width:700px;border-collapse:collapse;table-layout:fixed}thead{background:linear-gradient(100deg,#eaf3fd,#edf5fd)}th{height:68px;padding:12px 18px;text-align:center;font-size:20px;font-weight:900;border-right:1px solid #d7e3f1}th:last-child,td:last-child{border-right:0}td{height:91px;padding:13px 18px;text-align:center;border-top:1px solid #dfe8f2;border-right:1px solid #dfe8f2}tbody tr:first-child td{border-top:0}.rank-cell{width:16%}.user-cell{width:50%}.points-cell{width:34%}.crown-rank{width:68px;height:58px;position:relative;display:inline-grid;place-items:center;vertical-align:middle}.crown-rank svg{position:absolute;inset:0;width:100%;height:100%;fill:currentColor}.crown-rank b{position:relative;z-index:1;margin-top:8px;color:#fff;font-size:19px}.first{color:var(--gold)}.second{color:var(--silver)}.third{color:var(--bronze)}.skeleton{display:block;height:35px;margin:0 auto;border-radius:8px;background:linear-gradient(100deg,#dce3eb,#cbd6e2);max-width:100%}.user-skeleton{width:370px}.points-skeleton{width:190px}.result{min-height:24px;margin:14px 3px 0;color:#667e9e;font-weight:700}
    @media(max-width:900px){.layout{grid-template-columns:240px minmax(0,1fr)}.sidebar{padding:26px 8px}.nav-link{padding:0 16px;font-size:16px;gap:13px}main{padding:24px 17px}.filter-card{padding:22px;gap:18px}.page-title{font-size:42px}.section-title{font-size:29px}}
    @media(max-width:700px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:16px 6px}.user-badge{padding:0 5px 17px;justify-content:center}.user-badge .avatar{width:36px;height:36px}.user-badge span{display:none}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:13px 5px}main{padding:20px 12px}.page-title{font-size:34px;margin-bottom:17px}.filter-card{grid-template-columns:1fr;gap:16px;padding:18px 15px}.filter-label{font-size:18px;margin-bottom:7px}.select{height:52px;font-size:16px;padding:0 14px}.ranking-card{margin-top:17px;padding:18px 12px 22px}.section-title{font-size:23px;margin-bottom:15px}th{height:54px;font-size:15px;padding:8px}td{height:72px;padding:8px}.crown-rank{width:53px;height:47px}.crown-rank b{font-size:16px}.skeleton{height:26px}.user-skeleton{width:90%}.points-skeleton{width:80%}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面"><svg class="logo" viewBox="0 0 90 64" aria-hidden="true"><defs><linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs><path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#lb)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#lt)"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/></svg><span class="brand-title">画面タイトル</span></a>
    <div class="spacer"></div><div class="account"><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron"></i></div><a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー"><div class="user-badge"><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>称号</span></div><nav class="nav">
      <a class="nav-link" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-7H9v7H4v-9Z"/></svg><span>トップ画面</span></a>
      <a class="nav-link" href="activity.html"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.5a2.5 2.5 0 0 1-1-2Z"/></svg><span>活動用画面</span></a>
      <a class="nav-link" href="contact.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
      <a class="nav-link active" href="ranking.html"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
    </nav><div class="divider"></div><a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a></aside>
    <main>
      <h1 class="page-title">ランキング</h1>
      <section class="filter-card" aria-label="ランキングの絞り込み">
        <div><label class="filter-label" for="period">集計期間</label><select class="select" id="period"><option value="">選択してください</option><option>全期間</option><option>今年</option><option>今月</option></select></div>
        <div><label class="filter-label" for="target">対象</label><select class="select" id="target"><option value="">選択してください</option><option>全体</option><option>個人</option><option>家族</option><option>団体</option></select></div>
      </section>
      <section class="ranking-card" aria-labelledby="rankingTitle">
        <h2 class="section-title" id="rankingTitle">参加実績ランキング</h2>
        <div class="table-wrap"><table><colgroup><col class="rank-cell"><col class="user-cell"><col class="points-cell"></colgroup><thead><tr><th scope="col">順位</th><th scope="col">ユーザーニックネーム</th><th scope="col">ポイント</th></tr></thead><tbody>
          <tr><td><span class="crown-rank first"><svg viewBox="0 0 64 58" aria-hidden="true"><path d="M6 17 20 25 31 4l12 21 15-8-6 35H12Z"/><circle cx="6" cy="15" r="4"/><circle cx="31" cy="4" r="4"/><circle cx="58" cy="15" r="4"/></svg><b>1</b></span></td><td><span class="skeleton user-skeleton"></span></td><td><span class="skeleton points-skeleton"></span></td></tr>
          <tr><td><span class="crown-rank second"><svg viewBox="0 0 64 58" aria-hidden="true"><path d="M6 17 20 25 31 4l12 21 15-8-6 35H12Z"/><circle cx="6" cy="15" r="4"/><circle cx="31" cy="4" r="4"/><circle cx="58" cy="15" r="4"/></svg><b>2</b></span></td><td><span class="skeleton user-skeleton"></span></td><td><span class="skeleton points-skeleton"></span></td></tr>
          <tr><td><span class="crown-rank third"><svg viewBox="0 0 64 58" aria-hidden="true"><path d="M6 17 20 25 31 4l12 21 15-8-6 35H12Z"/><circle cx="6" cy="15" r="4"/><circle cx="31" cy="4" r="4"/><circle cx="58" cy="15" r="4"/></svg><b>3</b></span></td><td><span class="skeleton user-skeleton"></span></td><td><span class="skeleton points-skeleton"></span></td></tr>
        </tbody></table></div>
        <p class="result" id="result" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    const period=document.getElementById('period'), target=document.getElementById('target');
    function updateFilterNotice(){
      const result=document.getElementById('result');
      if(period.value||target.value) result.textContent='選択した条件でランキングを表示します（画面見本）';
      else result.textContent='';
    }
    period.addEventListener('change',updateFilterNotice);target.addEventListener('change',updateFilterNotice);
  </script>
</body>
</html>
