{% extends "natyukatu/base.html" %}
{% block title %}募集情報変更完了 | なちゅ活{% endblock %}

{% block content %}
<section class="complete-card" aria-labelledby="completeTitle">
  <div class="success-wrap" aria-hidden="true">
    <div class="success-mark">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="25"></circle>
        <path d="m18 32 10 10 20-22"></path>
      </svg>
    </div>
  </div>

  <h1 class="complete-title" id="completeTitle">
    募集情報変更完了
  </h1>

  <p class="message">
    募集情報を更新しました。
  </p>

  <a
    class="history-link"
    href="{{ url_for('natyukatu.recruitments') }}"
  >
    募集履歴画面へ
  </a>
</section>
{% endblock %}
