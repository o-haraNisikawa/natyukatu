<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参加履歴 | 画面タイトル</title>
  <style>
    :root{--navy:#102b55;--blue:#0788f5;--line:#dce6f2;--muted:#d5dce5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--navy);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;background:linear-gradient(135deg,#f7faff,#f1f7fc)}
    .topbar{height:94px;display:flex;align-items:center;padding:0 30px;background:rgba(255,255,255,.97);border-bottom:1px solid #e8eef5;box-shadow:0 3px 14px #1431510d}.brand{display:flex;align-items:center;gap:28px;color:inherit;text-decoration:none}.logo{width:72px;height:54px;flex:none}.brand-title{border-left:2px solid #e3eaf3;padding-left:28px;font-size:27px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.spacer{flex:1}.account{display:flex;align-items:center;gap:13px;padding:0 28px;border-left:1px solid var(--line);font-weight:800;white-space:nowrap}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#e8f1fb}.avatar svg{width:25px;fill:none;stroke:#4c78ad;stroke-width:1.8}.chevron{width:9px;height:9px;border-right:2px solid var(--navy);border-bottom:2px solid var(--navy);transform:rotate(45deg);margin:-5px 0 0 2px}.logout{min-width:145px;padding:12px 22px;border:1.5px solid var(--blue);border-radius:9px;background:#fff;color:var(--blue);font-weight:800;text-align:center;text-decoration:none}
    .layout{min-height:calc(100vh - 94px);display:grid;grid-template-columns:285px minmax(0,1fr)}.sidebar{padding:36px 12px;background:#ffffff80;border-right:1px solid var(--line)}.side-caption{padding:8px 18px 22px;color:#8092aa;font-weight:700}.nav{display:grid;gap:8px}.nav-link{height:61px;display:flex;align-items:center;gap:20px;padding:0 25px;border-radius:8px;color:var(--navy);font-size:19px;font-weight:700;text-decoration:none}.nav-link.active{background:#eaf4ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.nav-link svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.divider{height:1px;background:var(--line);margin:20px 18px}
    main{min-width:0;padding:34px 28px 44px}.page-title{margin:0 0 24px 4px;font-size:38px;line-height:1.25;font-weight:800}.history-card{padding:14px;border:1px solid #e0e8f1;border-radius:10px;background:#ffffffed;box-shadow:0 8px 26px #1d3f6708}.table-wrap{overflow-x:auto;border:1px solid #e3eaf2;border-radius:7px}table{width:100%;border-collapse:collapse;min-width:760px}thead{background:linear-gradient(100deg,#e7f2fc,#eaf4fc)}th{height:62px;padding:12px 16px;text-align:left;font-size:18px;font-weight:800;white-space:nowrap}td{height:86px;padding:12px 16px;border-top:1px solid #e2eaf3;font-size:18px;font-weight:700;white-space:nowrap}.skeleton{display:block;height:25px;border-radius:6px;background:linear-gradient(110deg,#dce2e9,#cfd7e0,#dce2e9)}.date-skeleton{width:166px}.name-skeleton{width:min(270px,100%)}.detail-link{color:var(--blue);text-decoration:underline;text-underline-offset:4px;font-weight:800}.status{font-weight:800}.status-select{width:230px;height:48px;padding:0 14px;border:1.5px solid var(--blue);border-radius:7px;background:#fff;color:#687a92;font:inherit;font-size:16px}.actions{display:flex;align-items:center;gap:24px;margin:24px 0 8px}.update-button{min-width:192px;min-height:58px;border:0;border-radius:8px;background:linear-gradient(100deg,#087df0,#00a9ad);color:white;font:inherit;font-size:19px;font-weight:800;cursor:pointer}.hint{margin:0;color:#647894;font-weight:700}.result{min-height:24px;margin:12px 0 0;color:#078568;font-weight:700}
    @media(max-width:900px){.layout{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:28px 9px}.nav-link{padding:0 16px;font-size:16px;gap:14px}main{padding:28px 18px}}
    @media(max-width:650px){.topbar{height:74px;padding:0 14px}.brand{gap:12px}.logo{width:48px;height:40px}.brand-title{padding-left:12px;font-size:18px}.account{display:none}.logout{min-width:94px;padding:9px 12px}.layout{min-height:calc(100vh - 74px);grid-template-columns:58px minmax(0,1fr)}.sidebar{padding:20px 6px}.side-caption{padding:7px 5px 18px;font-size:11px;overflow:hidden}.nav-link{height:48px;justify-content:center;padding:0}.nav-link span{display:none}.nav-link svg{width:22px}.divider{margin:15px 5px}main{padding:22px 12px}.page-title{font-size:30px;margin-bottom:18px}.history-card{padding:8px}.actions{align-items:flex-start;flex-direction:column;gap:12px;margin:18px 4px 4px}.update-button{width:100%;min-height:54px}.hint{font-size:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="top.html" aria-label="トップ画面">
      <svg class="logo" viewBox="0 0 90 64" aria-hidden="true">
        <defs><linearGradient id="logoBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168df2"/><stop offset="1" stop-color="#0066c9"/></linearGradient><linearGradient id="logoTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08bcae"/><stop offset="1" stop-color="#008c8b"/></linearGradient></defs>
        <path d="M7 31 31 7q4-4 8 0l20 20-24 24q-4 4-8 0L7 35q-2-2 0-4Z" fill="url(#logoBlue)"/><path d="m34 31 24-24q4-4 8 0l20 20q3 3 0 6L62 57q-4 4-8 0L34 37q-3-3 0-6Z" fill="url(#logoTeal)" opacity=".96"/><path d="m37 29 9-9 15 15-9 9Z" fill="#fff" opacity=".88"/>
      </svg>
      <span class="brand-title">画面タイトル</span>
    </a>
    <div class="spacer"></div>
    <div class="account"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4 3.2-6 8-6s7.5 2 8 6"/></svg></span><span>ログインユーザー名</span><i class="chevron" aria-hidden="true"></i></div>
    <a class="logout" href="logout-confirm.html">ログアウト</a>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="メインメニュー">
      <div class="side-caption">称号</div>
      <nav class="nav">
        <a class="nav-link active" href="top.html"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>トップ画面</span></a>
        <a class="nav-link" href="#contact"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="m4 7 8 6 8-6"/></svg><span>お問い合わせ</span></a>
        <a class="nav-link" href="#ranking"><svg viewBox="0 0 24 24"><path d="M5 20h14l1-11-5 3-3-7-3 7-5-3Z"/><path d="M7 20v2h10v-2"/></svg><span>ランキング</span></a>
      </nav>
      <div class="divider"></div>
      <a class="nav-link" href="logout-confirm.html"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>ログアウト</span></a>
    </aside>
    <main>
      <h1 class="page-title">参加履歴</h1>
      <section class="history-card" aria-label="参加履歴一覧">
        <div class="table-wrap">
          <table>
            <thead><tr><th scope="col">開催日時</th><th scope="col">募集名</th><th scope="col">詳細</th><th scope="col">状態</th><th scope="col">状態変更</th></tr></thead>
            <tbody>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">申し込み済</td><td>－</td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">参加中</td><td><select class="status-select" aria-label="参加中の状態を変更"><option value="">選択してください</option><option value="withdrawn">辞退</option><option value="completed">完了</option></select></td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">辞退</td><td>－</td></tr>
              <tr><td><span class="skeleton date-skeleton" aria-label="開催日時"></span></td><td><span class="skeleton name-skeleton" aria-label="募集名"></span></td><td><a class="detail-link" href="recruitment-detail.html">詳細を見る</a></td><td class="status">完了</td><td>－</td></tr>
            </tbody>
          </table>
        </div>
        <div class="actions"><button class="update-button" type="button" id="updateButton">更新</button><p class="hint">状態変更は参加中の場合のみ表示</p></div>
        <p class="result" id="result" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script>
    document.getElementById('updateButton').addEventListener('click', () => {
      const select = document.querySelector('.status-select');
      const result = document.getElementById('result');
      if (!select.value) {
        result.textContent = '状態を選択してください。';
        return;
      }
      const row = select.closest('tr');
      row.querySelector('.status').textContent = select.value === 'withdrawn' ? '辞退' : '完了';
      row.cells[4].textContent = '－';
      result.textContent = '参加状態を更新しました（画面見本）';
    });
  </script>
</body>
</html>
