{% extends "natyukatu/base.html" %}

{% block content %}
<div class="title-row">
  <h1 class="page-title">ユーザー情報表示</h1>
</div>

<section class="profile-card" aria-label="ユーザー情報">
  <div class="portrait-area">
    <div class="portrait" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="38" r="24"></circle>
        <path d="M15 111c2-27 17-42 45-42s43 15 45 42Z"></path>
      </svg>
    </div>
  </div>

  <div class="profile-row">
    <span class="label">ユーザーニックネーム</span>
    <span>{{ user.nickname }}</span>
  </div>

  <div class="profile-row">
    <span class="label">名前</span>
    <span>{{ user.username }}</span>
  </div>

  <div class="profile-row">
    <span class="label">年齢</span>
    <span>{{ user.age }}歳</span>
  </div>

  <div class="profile-row">
    <span class="label">称号</span>
    <span>
      {{ user.users_title.title_name
         if user.users_title
         else "未設定" }}
    </span>
  </div>
</section>
{% endblock %}
